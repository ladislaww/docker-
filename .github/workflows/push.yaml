name: golang-pipeline

on:
  push:
    branches:
      - main
    tags:
      - '*'  # workflow срабатывает на все теги

jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.24-alpine
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: go mod download

      - name: Run Unit Tests
        run: GOOS=linux GOARCH=amd64 go test ./... -v

      - name: Vet
        run: go vet ./...

  deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # Создаём метаданные вручную, чтобы не было лишнего слэша
      - name: Set Docker image tags
        id: docker-tags
        run: |
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/docker-final"  # имя образа на DockerHub
          TAG=$(echo "${GITHUB_REF##*/}")  # тег из git
          echo "image=${IMAGE_NAME}:${TAG}" >> $GITHUB_ENV
          echo "image_latest=${IMAGE_NAME}:latest" >> $GITHUB_ENV

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.image }}
            ${{ env.image_latest }}